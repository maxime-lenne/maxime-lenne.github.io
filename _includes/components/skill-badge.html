{% comment %}
  One skill as a list item with the hero badge look (components/badge.html default style).
  Params: text, icon (optional, shown before the text), title (optional tooltip).
  Use it inside <ul class="deep-stack-cv-skills__list">.
{% endcomment %}
<li class="deep-stack-hero__badge"{% if include.title %} title="{{ include.title | escape }}"{% endif %}><span class="deep-stack-hero__badge-text">{% if include.icon %}{{ include.icon }} {% endif %}{{ include.text }}</span></li>
