# Site settings
title: "Maxime Lenne - CTO & Tech Product Leader"
email: "hello@maxime-lenne.fr"
description: "Expert en entrepreneuriat tech, innovation et développement produit"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://maxime-lenne.fr" # the base hostname & protocol for your site

# Multi-language support
languages: ["fr", "en"]
default_lang: "fr"
exclude_from_localizations: ["javascript", "images", "css", "assets"]

# Author information
author:
  name: "Maxime Lenne"
  bio: "CTO & Tech Product Leader"
  location: "France"
  email: "hello@maxime-lenne.fr"
  twitter: "MaximeLenne"
  github: "maxime-lenne"
  linkedin: "maximelenne"

# Social media
social:
  name: "Maxime Lenne"
  links:
    - "https://twitter.com/MaximeLenne"
    - "https://linkedin.com/in/maximelenne"
    - "https://github.com/maxime-lenne"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
relative_links:
  enabled: true
  collections: true

# Plugins configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-compress-images
  - jekyll-minifier

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# SEO configuration
seo:
  title: "Maxime Lenne - CTO & Tech Product Leader"
  description: "Expert en entrepreneuriat tech, innovation et développement produit"
  image: "/assets/images/og-image.jpg"
  type: "website"
  twitter:
    card: "summary_large_image"
    creator: "@MaximeLenne"

# Collections
collections_dir: _collections

collections:
  projects:
    output: true
    permalink: /projects/:title/
  experiences:
    output: true  # ✅ Active les pages individuelles
    permalink: /experiences/:slug/
  skills:
    output: false  # Collection de données seulement
  educations:
    output: false  # Collection de données seulement
  awards:
    output: false  # Collection de données seulement
  contributions:
    output: false  # Collection de données seulement
  services:
    output: false  # Collection de données seulement
  testimonials:
    output: false  # Collection de données seulement

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Maxime Lenne"
      comments: false
      share: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      author: "Maxime Lenne"
  - scope:
      path: ""
      type: "experiences"
    values:
      layout: "experience"
      author: "Maxime Lenne"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      author: "Maxime Lenne"

# =====================================================
# NOTION CMS CONFIGURATION
# =====================================================
# Jekyll Notion CMS Plugin - Configuration des collections
# Documentation: docs/NOTION_SETUP.md
notion:
  # Enabled: true pour utiliser Notion, false pour utiliser les collections Jekyll
  enabled: true

  # Configuration des collections Notion
  collections:
    skills:
      database_env: NOTION_SKILLS_DB
      data_file: notion_skills.yml
      organizer: items_by_category
      properties:
        - { name: Name, type: title }
        - { name: Level, type: number }
        - { name: Years, type: number }
        - { name: Featured, type: checkbox }
        - { name: Order, type: number }
        - { name: Category, type: rollup }
        - { name: Icon, type: rollup }
        - { name: Color, type: rollup }
        - { name: Category Order, type: rollup }

    experiences:
      database_env: NOTION_EXPERIENCES_DB
      data_file: notion_experiences.yml
      organizer: simple_list
      sort_by: order
      properties:
        - { name: Title, type: title }
        - { name: Company, type: rich_text }
        - { name: Role, type: rich_text }
        - { name: Start Date, type: date, key: start_date }
        - { name: End Date, type: date, key: end_date }
        - { name: Current, type: checkbox }
        - { name: Location, type: rich_text }
        - { name: Type, type: rich_text }
        - { name: Order, type: number }
        - { name: Logo URL, type: url, key: logo_url }
        - { name: Description, type: rich_text }
        - { name: About, type: rich_text }
        - { name: Tags, type: multi_select }
        - { name: Skills, type: rollup }
        - { name: Achievements, type: formula_array }
        - { name: Missions, type: formula_array }

    awards:
      database_env: NOTION_AWARDS_DB
      data_file: notion_awards.yml
      organizer: simple_list
      sort_by: order
      properties:
        - { name: Title, type: title }
        - { name: Organization, type: rich_text }
        - { name: Date, type: date }
        - { name: Order, type: number }
        - { name: Project, type: rich_text }
        - { name: Description, type: rich_text }
        - { name: Achievements, type: multi_select }
        - { name: Impact, type: rich_text }

    contributions:
      database_env: NOTION_CONTRIBUTIONS_DB
      data_file: notion_contributions.yml
      organizer: simple_list
      sort_by: order
      properties:
        - { name: Title, type: title }
        - { name: Description, type: rich_text }
        - { name: Links, type: rich_text }
        - { name: Order, type: number }
        - { name: Achievements, type: multi_select }
        - { name: Labels, type: multi_select }

    educations:
      database_env: NOTION_EDUCATIONS_DB
      data_file: notion_educations.yml
      organizer: simple_list
      sort_by: order
      properties:
        - { name: Title, type: title }
        - { name: Institution, type: rich_text }
        - { name: Degree Type, type: rich_text, key: degree_type }
        - { name: Location, type: rich_text }
        - { name: Field, type: rich_text }
        - { name: Start Date, type: date, key: start_date }
        - { name: End Date, type: date, key: end_date }
        - { name: Completed, type: checkbox }
        - { name: Order, type: number }
        - { name: Description, type: rich_text }
        - { name: Skills, type: multi_select }

    services:
      database_env: NOTION_SERVICES_DB
      data_file: notion_services.yml
      organizer: simple_list
      sort_by: order
      properties:
        - { name: Title, type: title }
        - { name: Icon, type: rich_text }
        - { name: Order, type: number }
        - { name: Description, type: rich_text }
        - { name: Features, type: multi_select }
        - { name: Feature Type, type: rich_text, key: feature_type }
        - { name: Keywords, type: multi_select }

    testimonials:
      database_env: NOTION_TESTIMONIALS_DB
      data_file: notion_testimonials.yml
      organizer: simple_list
      sort_by: order
      properties:
        - { name: Name, type: title }
        - { name: Role, type: rich_text }
        - { name: Image, type: rich_text }
        - { name: Order, type: number }
        - { name: Quote, type: rich_text }
        - { name: Rating, type: number }

    # Articles de blog multilingues (nouveau)
    blog_posts:
      database_env: NOTION_BLOG_DB
      data_file: notion_blog_posts.yml
      organizer: simple_list
      sort_by: published_at
      sort_order: desc
      multilingual: true
      properties:
        - { name: Title, type: title }
        - { name: Slug, type: rich_text }
        - { name: Language, type: select }  # fr, en
        - { name: Published At, type: date, key: published_at }
        - { name: Updated At, type: date, key: updated_at }
        - { name: Status, type: select }  # draft, published, archived
        - { name: Excerpt, type: rich_text }
        - { name: Content, type: rich_text }
        - { name: Featured Image, type: url, key: featured_image }
        - { name: Categories, type: multi_select }
        - { name: Tags, type: multi_select }
        - { name: Author, type: rich_text }
        - { name: Reading Time, type: number, key: reading_time }
        - { name: Featured, type: checkbox }
        - { name: SEO Title, type: rich_text, key: seo_title }
        - { name: SEO Description, type: rich_text, key: seo_description }

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .jekyll-cache/
  - .sass-cache/
  - _site/
  - lighthouse-report.html
  - .env
  - .env.local
  - _compress_images_cache.yml
