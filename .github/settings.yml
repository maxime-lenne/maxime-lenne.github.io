# Repository Settings - Managed by https://github.com/apps/settings
# Install the app and changes to this file will be synced to GitHub

# =============================================================================
# REPOSITORY SETTINGS
# =============================================================================
repository:
  homepage: https://maxime-lenne.fr
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false
  default_branch: main
  allow_squash_merge: false
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# =============================================================================
# LABELS
# =============================================================================
labels:
  - name: bug
    color: d73a4a
    description: Something isn't working

  - name: feature
    color: a2eeef
    description: New feature or request

  - name: enhancement
    color: 84b6eb
    description: Improvement to existing feature

  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation

  - name: content
    color: e4e669
    description: Copy, images or data update

  - name: refactor
    color: fbca04
    description: Code refactoring without behavior change

  - name: priority:high
    color: d93f0b
    description: High priority

  - name: priority:medium
    color: fbca04
    description: Medium priority

  - name: priority:low
    color: 0e8a16
    description: Low priority

  - name: status:in-progress
    color: fbca04
    description: Currently being worked on

  - name: status:needs-review
    color: 0e8a16
    description: Ready for review

  - name: status:needs-info
    color: d876e3
    description: Needs more information

  - name: dependencies
    color: 0366d6
    description: Dependency updates

  - name: github-actions
    color: 000000
    description: GitHub Actions updates

  - name: ruby
    color: cc0000
    description: Ruby / Bundler dependency

  - name: npm
    color: cb3837
    description: npm dependency

# =============================================================================
# BRANCH PROTECTION
# =============================================================================
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts: []
      enforce_admins: false
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null
