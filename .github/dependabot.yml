# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Ruby / Bundler dependencies
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆️"
    labels:
      - "dependencies"
      - "ruby"
    reviewers:
      - "maxime-lenne"
    groups:
      ruby-dependencies:
        update-types:
          - "minor"
          - "patch"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆️"
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "maxime-lenne"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "maxime-lenne"
