# Production configuration overrides
# Use with: bundle exec jekyll build --config _config.yml,_config_prod.yml

# Environment
JEKYLL_ENV: production

# Performance optimizations
minify: true
compress: true
incremental: false

# Asset optimization
assets:
  compress: true
  gzip: true
  cache: true

# Image optimization
compress_images:
  quality: 85
  webp: true
  progressive: true

# Analytics and monitoring
# Cloudflare Web Analytics site token (public, it ends up in the page): dash.cloudflare.com → Web Analytics
cloudflare_analytics_token: "492ee525717445b9b56c7ea496ebc994"

# Security headers
security:
  headers:
    - "X-Frame-Options: DENY"
    - "X-Content-Type-Options: nosniff"
    - "Referrer-Policy: strict-origin-when-cross-origin"
    - "Permissions-Policy: camera=(), microphone=(), geolocation=()"
